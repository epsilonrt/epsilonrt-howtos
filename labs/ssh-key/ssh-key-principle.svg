<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Principe de l'authentification SSH par paire de cles">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#37474f"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32"/>
    </marker>
  </defs>

  <rect width="900" height="620" fill="#ffffff"/>

  <!-- ===================== PANEL 1 ===================== -->
  <text x="40" y="38" font-size="18" font-weight="600" fill="#1a237e">1 — Mise en place : une seule fois par carte</text>

  <!-- Poste -->
  <rect x="40" y="58" width="310" height="160" rx="10" fill="#f5f7fa" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="60" y="84" font-size="15" font-weight="600" fill="#263238">Votre poste de salle (LNTC…)</text>

  <circle cx="72" cy="116" r="7" fill="none" stroke="#c62828" stroke-width="3"/>
  <path d="M79 116 H104 M98 116 v6 M104 116 v8" stroke="#c62828" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="118" y="114" font-size="13.5" font-weight="600" fill="#c62828">moitié privée</text>
  <text x="118" y="131" font-size="12" fill="#546e7a">U:\ssh\id_ed25519</text>

  <circle cx="72" cy="168" r="7" fill="none" stroke="#2e7d32" stroke-width="3"/>
  <path d="M79 168 H104 M98 168 v6 M104 168 v8" stroke="#2e7d32" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="118" y="166" font-size="13.5" font-weight="600" fill="#2e7d32">moitié publique</text>
  <text x="118" y="183" font-size="12" fill="#546e7a">U:\ssh\id_ed25519.pub</text>

  <!-- Transfert -->
  <line x1="360" y1="150" x2="540" y2="150" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="450" y="132" font-size="13" font-weight="600" fill="#2e7d32" text-anchor="middle">copier-coller</text>
  <text x="450" y="172" font-size="12" fill="#546e7a" text-anchor="middle">seule la moitié publique</text>
  <text x="450" y="188" font-size="12" fill="#546e7a" text-anchor="middle">fait le voyage</text>

  <!-- Raspberry Pi -->
  <rect x="550" y="58" width="310" height="160" rx="10" fill="#f5f7fa" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="570" y="84" font-size="15" font-weight="600" fill="#263238">Votre Raspberry Pi</text>

  <circle cx="582" cy="126" r="7" fill="none" stroke="#2e7d32" stroke-width="3"/>
  <path d="M589 126 H614 M608 126 v6 M614 126 v8" stroke="#2e7d32" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="628" y="124" font-size="13.5" font-weight="600" fill="#2e7d32">moitié publique</text>
  <text x="628" y="141" font-size="12" fill="#546e7a">~/.ssh/authorized_keys</text>
  <text x="570" y="180" font-size="12" fill="#546e7a">La liste des moitiés publiques</text>
  <text x="570" y="196" font-size="12" fill="#546e7a">autorisées à ouvrir une session.</text>

  <!-- ===================== PANEL 2 ===================== -->
  <text x="40" y="288" font-size="18" font-weight="600" fill="#1a237e">2 — À chaque connexion, ensuite</text>

  <rect x="40" y="308" width="310" height="180" rx="10" fill="#f5f7fa" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="60" y="334" font-size="15" font-weight="600" fill="#263238">Agent SSH du poste</text>

  <circle cx="72" cy="372" r="7" fill="none" stroke="#c62828" stroke-width="3"/>
  <path d="M79 372 H104 M98 372 v6 M104 372 v8" stroke="#c62828" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="118" y="370" font-size="13.5" font-weight="600" fill="#c62828">moitié privée</text>
  <text x="118" y="387" font-size="12" fill="#546e7a">chargée automatiquement</text>
  <text x="60" y="424" font-size="12" fill="#546e7a">Elle n'existe pas sous forme de</text>
  <text x="60" y="440" font-size="12" fill="#546e7a">fichier sur le poste, et l'agent</text>
  <text x="60" y="456" font-size="12" fill="#546e7a">ne sait pas la restituer.</text>

  <rect x="550" y="308" width="310" height="180" rx="10" fill="#f5f7fa" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="570" y="334" font-size="15" font-weight="600" fill="#263238">sshd sur la carte</text>

  <circle cx="582" cy="372" r="7" fill="none" stroke="#2e7d32" stroke-width="3"/>
  <path d="M589 372 H614 M608 372 v6 M614 372 v8" stroke="#2e7d32" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="628" y="370" font-size="13.5" font-weight="600" fill="#2e7d32">moitié publique</text>
  <text x="570" y="424" font-size="12" fill="#546e7a">Elle ne permet pas de signer,</text>
  <text x="570" y="440" font-size="12" fill="#546e7a">seulement de vérifier. La divulguer</text>
  <text x="570" y="456" font-size="12" fill="#546e7a">ne compromet rien.</text>

  <!-- Réseau -->
  <line x1="450" y1="300" x2="450" y2="500" stroke="#b0bec5" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="450" y="512" font-size="11.5" fill="#90a4ae" text-anchor="middle">réseau</text>

  <!-- Echanges -->
  <line x1="540" y1="352" x2="360" y2="352" stroke="#37474f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="450" y="344" font-size="12.5" fill="#37474f" text-anchor="middle">① un défi aléatoire</text>

  <line x1="360" y1="400" x2="540" y2="400" stroke="#37474f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="450" y="392" font-size="12.5" fill="#37474f" text-anchor="middle">② le défi signé</text>

  <text x="450" y="444" font-size="12.5" fill="#37474f" text-anchor="middle">③ signature vérifiée</text>
  <text x="450" y="460" font-size="12.5" fill="#37474f" text-anchor="middle">→ session ouverte</text>

  <!-- Conclusion -->
  <rect x="40" y="540" width="820" height="52" rx="8" fill="#fff4f4" stroke="#ef9a9a" stroke-width="1.5"/>
  <text x="62" y="564" font-size="13.5" font-weight="600" fill="#c62828">La moitié privée ne traverse jamais le réseau.</text>
  <text x="62" y="582" font-size="12.5" fill="#546e7a">Elle ne sert qu'à calculer une preuve — la signature — que la moitié publique suffit à vérifier.</text>

</svg>
