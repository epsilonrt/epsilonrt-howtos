<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Signal rectangulaire PWM : période T égale à l'inverse de la fréquence F, durée à l'état haut ton, durée à l'état bas toff, rapport cyclique ton sur T, valeur moyenne égale au rapport cyclique fois Vcc">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#37474f"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a237e"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828"/>
    </marker>
  </defs>

  <rect width="900" height="400" fill="#ffffff"/>

  <!-- Repères verticaux (début et fin de ton, fin de période) -->
  <g stroke="#90a4ae" stroke-width="1" stroke-dasharray="5 4">
    <line x1="100" y1="55" x2="100" y2="335"/>
    <line x1="220" y1="55" x2="220" y2="270"/>
    <line x1="400" y1="55" x2="400" y2="335"/>
    <line x1="520" y1="120" x2="520" y2="270"/>
    <line x1="700" y1="120" x2="700" y2="270"/>
  </g>

  <!-- Niveaux haut et bas -->
  <g stroke="#cfd8dc" stroke-width="1">
    <line x1="60" y1="100" x2="880" y2="100"/>
    <line x1="60" y1="250" x2="880" y2="250"/>
  </g>
  <text x="52" y="105" font-size="14" font-weight="600" fill="#263238" text-anchor="end">Vcc</text>
  <text x="52" y="255" font-size="14" font-weight="600" fill="#263238" text-anchor="end">0 V</text>

  <!-- Valeur moyenne : 40 % de l'écart entre 0 V et Vcc -->
  <line x1="60" y1="190" x2="880" y2="190" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="310" y="182" font-size="13" fill="#2e7d32" text-anchor="middle">valeur moyenne = α × Vcc</text>

  <!-- Signal -->
  <path d="M 60 250 L 100 250 L 100 100 L 220 100 L 220 250 L 400 250 L 400 100 L 520 100 L 520 250 L 700 250 L 700 100 L 820 100 L 820 250 L 870 250"
        fill="none" stroke="#1a237e" stroke-width="3" stroke-linejoin="miter"/>
  <text x="878" y="242" font-size="13" font-style="italic" fill="#546e7a" text-anchor="end">t</text>

  <!-- ton -->
  <line x1="102" y1="75" x2="218" y2="75" stroke="#1a237e" stroke-width="1.5" marker-start="url(#arrowBlue)" marker-end="url(#arrowBlue)"/>
  <text x="160" y="66" font-size="15" font-weight="600" fill="#1a237e" text-anchor="middle">t<tspan font-size="11" dy="4">on</tspan></text>

  <!-- toff -->
  <line x1="222" y1="75" x2="398" y2="75" stroke="#c62828" stroke-width="1.5" marker-start="url(#arrowRed)" marker-end="url(#arrowRed)"/>
  <text x="310" y="66" font-size="15" font-weight="600" fill="#c62828" text-anchor="middle">t<tspan font-size="11" dy="4">off</tspan></text>

  <!-- Période T -->
  <line x1="102" y1="310" x2="398" y2="310" stroke="#37474f" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="250" y="303" font-size="15" font-weight="600" fill="#263238" text-anchor="middle">T = t<tspan font-size="11" dy="4">on</tspan><tspan dy="-4"> + t</tspan><tspan font-size="11" dy="4">off</tspan><tspan dy="-4"> = 1 / F</tspan></text>

  <!-- Formules -->
  <rect x="100" y="345" width="700" height="42" rx="8" fill="#f5f7fa" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="190" y="372" font-size="15" fill="#263238" text-anchor="middle">F = 1 / T</text>
  <text x="560" y="372" font-size="15" fill="#263238" text-anchor="middle">rapport cyclique  α = t<tspan font-size="11" dy="4">on</tspan><tspan dy="-4"> / T = t</tspan><tspan font-size="11" dy="4">on</tspan><tspan dy="-4"> / (t</tspan><tspan font-size="11" dy="4">on</tspan><tspan dy="-4"> + t</tspan><tspan font-size="11" dy="4">off</tspan><tspan dy="-4">)   (ici α = 40 %)</tspan></text>
</svg>
