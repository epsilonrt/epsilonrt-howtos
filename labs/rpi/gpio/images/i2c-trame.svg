<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Chronogramme d'un octet d'adresse sur le bus I2C : condition START (SDA passe au niveau bas pendant que SCL est haut), sept bits d'adresse, le bit R/W, le bit d'acquittement ACK mis à zéro par l'esclave, puis condition STOP (SDA passe au niveau haut pendant que SCL est haut)">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#37474f"/>
    </marker>
  </defs>
  <rect width="900" height="400" fill="#ffffff"/>

  <line x1="175" y1="102" x2="175" y2="288" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="235" y1="102" x2="235" y2="288" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="295" y1="102" x2="295" y2="288" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="355" y1="102" x2="355" y2="288" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="415" y1="102" x2="415" y2="288" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="475" y1="102" x2="475" y2="288" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="535" y1="102" x2="535" y2="288" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="595" y1="102" x2="595" y2="288" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="655" y1="102" x2="655" y2="288" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="60" y="140" font-size="15" font-weight="600" fill="#2e7d32" text-anchor="end">SCL</text>
  <text x="60" y="260" font-size="15" font-weight="600" fill="#1a237e" text-anchor="end">SDA</text>
  <path d="M 70 110 L 135 110 L 135 160 L 160 160 L 160 110 L 190 110 L 190 160 L 220 160 L 220 110 L 250 110 L 250 160 L 280 160 L 280 110 L 310 110 L 310 160 L 340 160 L 340 110 L 370 110 L 370 160 L 400 160 L 400 110 L 430 110 L 430 160 L 460 160 L 460 110 L 490 110 L 490 160 L 520 160 L 520 110 L 550 110 L 550 160 L 580 160 L 580 110 L 610 110 L 610 160 L 640 160 L 640 110 L 670 110 L 670 160 L 750 160 L 750 110 L 860 110" fill="none" stroke="#2e7d32" stroke-width="3"/>
  <path d="M 70 230 L 120 230 L 120 280 L 150 280 L 150 230 L 270 230 L 270 280 L 330 280 L 330 230 L 390 230 L 390 280 L 780 280 L 780 280 L 780 280 L 780 230 L 860 230" fill="none" stroke="#1a237e" stroke-width="3"/>
  <line x1="630" y1="280" x2="690" y2="280" stroke="#c62828" stroke-width="3"/>
  <text x="175" y="216" font-size="13" font-weight="600" fill="#263238" text-anchor="middle">1</text>
  <text x="175" y="94" font-size="12" fill="#263238" text-anchor="middle">A6</text>
  <text x="235" y="216" font-size="13" font-weight="600" fill="#263238" text-anchor="middle">1</text>
  <text x="235" y="94" font-size="12" fill="#263238" text-anchor="middle">A5</text>
  <text x="295" y="216" font-size="13" font-weight="600" fill="#263238" text-anchor="middle">0</text>
  <text x="295" y="94" font-size="12" fill="#263238" text-anchor="middle">A4</text>
  <text x="355" y="216" font-size="13" font-weight="600" fill="#263238" text-anchor="middle">1</text>
  <text x="355" y="94" font-size="12" fill="#263238" text-anchor="middle">A3</text>
  <text x="415" y="216" font-size="13" font-weight="600" fill="#263238" text-anchor="middle">0</text>
  <text x="415" y="94" font-size="12" fill="#263238" text-anchor="middle">A2</text>
  <text x="475" y="216" font-size="13" font-weight="600" fill="#263238" text-anchor="middle">0</text>
  <text x="475" y="94" font-size="12" fill="#263238" text-anchor="middle">A1</text>
  <text x="535" y="216" font-size="13" font-weight="600" fill="#263238" text-anchor="middle">0</text>
  <text x="535" y="94" font-size="12" fill="#263238" text-anchor="middle">A0</text>
  <text x="595" y="216" font-size="13" font-weight="600" fill="#c62828" text-anchor="middle">0</text>
  <text x="595" y="94" font-size="12" fill="#c62828" text-anchor="middle">R/W</text>
  <text x="655" y="216" font-size="13" font-weight="600" fill="#c62828" text-anchor="middle">0</text>
  <text x="655" y="94" font-size="12" fill="#c62828" text-anchor="middle">ACK</text>
  <line x1="150" y1="52" x2="560" y2="52" stroke="#1a237e" stroke-width="1.8" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="355.0" y="44" font-size="13" font-weight="600" fill="#1a237e" text-anchor="middle">adresse de l&#39;esclave sur 7 bits (ici 1101000 = 0x68)</text>
  <text x="595" y="44" font-size="12" font-weight="600" fill="#c62828" text-anchor="middle">0 = écriture</text>
  <text x="595" y="60" font-size="12" font-weight="600" fill="#c62828" text-anchor="middle">1 = lecture</text>
  <text x="670" y="78" font-size="12" font-weight="600" fill="#c62828" text-anchor="middle">l&#39;esclave répond</text>
  <text x="128" y="322" font-size="13" font-weight="600" fill="#263238" text-anchor="middle">START</text>
  <text x="128" y="338" font-size="11" fill="#546e7a" text-anchor="middle">SDA descend,</text>
  <text x="128" y="351" font-size="11" fill="#546e7a" text-anchor="middle">SCL est haut</text>
  <text x="780" y="322" font-size="13" font-weight="600" fill="#263238" text-anchor="middle">STOP</text>
  <text x="780" y="338" font-size="11" fill="#546e7a" text-anchor="middle">SDA monte,</text>
  <text x="780" y="351" font-size="11" fill="#546e7a" text-anchor="middle">SCL est haut</text>
  <text x="675" y="322" font-size="11" fill="#546e7a" text-anchor="middle">(octets de</text>
  <text x="675" y="335" font-size="11" fill="#546e7a" text-anchor="middle">données…)</text>
  <text x="450" y="385" font-size="12" fill="#546e7a" text-anchor="middle">Les données ne changent que lorsque SCL est bas ; elles sont lues quand SCL est haut.</text>
</svg>
