  <text x="644.0" y="146" font-size="12" fill="#c62828" text-anchor="middle">1 = lecture</text>
  <text x="30" y="200" font-size="15" font-weight="600" fill="#1a237e">2. L&#39;adresse sur 7 bits, alignée à droite : celle de Linux, de i2c-tools et de piduino</text>
