<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Deux façons d'écrire l'adresse I2C d'un composant : l'octet envoyé sur le bus contient les sept bits d'adresse suivis du bit R/W ; écrite sur sept bits alignés à droite elle vaut 0x68, écrite sur huit bits alignés à gauche avec le bit R/W elle vaut 0xD0 en écriture et 0xD1 en lecture">
