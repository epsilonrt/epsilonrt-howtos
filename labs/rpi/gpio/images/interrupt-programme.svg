<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Interruption de programme : dans le principe, le processeur suspend le programme principal quand un front est détecté, exécute la routine d'interruption puis reprend ; avec piduino sous Linux, le noyau détecte le front et réveille un fil d'exécution dédié qui appelle la routine pendant que le programme principal continue">

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#37474f"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828"/>
    </marker>
  </defs>

  <rect width="900" height="540" fill="#ffffff"/>

  <!-- ===================== Principe ===================== -->
  <text x="30" y="32" font-size="16" font-weight="600" fill="#263238">Le principe : le processeur suspend le programme principal</text>

  <!-- événements -->
  <g stroke="#c62828" stroke-width="2" fill="none">
    <line x1="260" y1="62" x2="260" y2="104" marker-end="url(#arrRed)"/>
    <line x1="560" y1="62" x2="560" y2="104" marker-end="url(#arrRed)"/>
  </g>
  <text x="260" y="54" font-size="12" font-weight="600" fill="#c62828" text-anchor="middle">front détecté</text>
  <text x="560" y="54" font-size="12" font-weight="600" fill="#c62828" text-anchor="middle">front détecté</text>

  <!-- ligne de temps du processeur -->
  <rect x="60" y="108" width="200" height="40" fill="#e8eaf6" stroke="#1a237e" stroke-width="1.5"/>
  <rect x="260" y="108" width="80" height="40" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
  <rect x="340" y="108" width="220" height="40" fill="#e8eaf6" stroke="#1a237e" stroke-width="1.5"/>
  <rect x="560" y="108" width="80" height="40" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
  <rect x="640" y="108" width="200" height="40" fill="#e8eaf6" stroke="#1a237e" stroke-width="1.5"/>
  <text x="160" y="133" font-size="13" font-weight="600" fill="#1a237e" text-anchor="middle">programme principal</text>
  <text x="300" y="133" font-size="13" font-weight="600" fill="#c62828" text-anchor="middle">isr</text>
  <text x="450" y="133" font-size="13" font-weight="600" fill="#1a237e" text-anchor="middle">programme principal</text>
  <text x="600" y="133" font-size="13" font-weight="600" fill="#c62828" text-anchor="middle">isr</text>
  <text x="740" y="133" font-size="13" font-weight="600" fill="#1a237e" text-anchor="middle">programme principal</text>
  <line x1="60" y1="165" x2="860" y2="165" stroke="#546e7a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="866" y="169" font-size="12" fill="#546e7a">temps</text>

  <!-- étapes -->
  <g font-size="12" fill="#263238">
    <circle cx="70" cy="200" r="10" fill="#1a237e"/><text x="70" y="204" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">1</text>
    <text x="88" y="204">Le programme s'exécute normalement.</text>
    <circle cx="70" cy="226" r="10" fill="#c62828"/><text x="70" y="230" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">2</text>
    <text x="88" y="230">Un front arrive : le processeur s'interrompt, mémorise où il en était, et exécute la routine d'interruption.</text>
    <circle cx="70" cy="252" r="10" fill="#1a237e"/><text x="70" y="256" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">3</text>
    <text x="88" y="256">La routine est terminée : le programme reprend exactement là où il s'était arrêté.</text>
  </g>

  <line x1="30" y1="285" x2="870" y2="285" stroke="#cfd8dc" stroke-width="1.5"/>

  <!-- ===================== Avec piduino ===================== -->
  <text x="30" y="316" font-size="16" font-weight="600" fill="#263238">Avec piduino sous Linux : la routine s'exécute dans un autre fil d'exécution</text>

  <text x="60" y="352" font-size="12" font-weight="600" fill="#546e7a">Noyau Linux</text>
  <text x="60" y="412" font-size="12" font-weight="600" fill="#546e7a">Fil d'exécution de piduino</text>
  <text x="60" y="472" font-size="12" font-weight="600" fill="#546e7a">Programme principal</text>

  <!-- noyau : événements -->
  <line x1="60" y1="378" x2="850" y2="378" stroke="#b0bec5" stroke-width="1.5"/>
  <rect x="245" y="360" width="30" height="36" rx="4" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
  <rect x="545" y="360" width="30" height="36" rx="4" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="260" y="383" font-size="11" font-weight="600" fill="#ef6c00" text-anchor="middle">front</text>
  <text x="560" y="383" font-size="11" font-weight="600" fill="#ef6c00" text-anchor="middle">front</text>

  <!-- fil d'exécution : attente puis isr -->
  <line x1="60" y1="438" x2="850" y2="438" stroke="#b0bec5" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="265" y="420" width="70" height="36" rx="4" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
  <rect x="565" y="420" width="70" height="36" rx="4" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
  <text x="300" y="443" font-size="13" font-weight="600" fill="#c62828" text-anchor="middle">isr</text>
  <text x="600" y="443" font-size="13" font-weight="600" fill="#c62828" text-anchor="middle">isr</text>
  <text x="440" y="432" font-size="11" fill="#78909c" text-anchor="middle">en attente d'un événement</text>
  <g stroke="#ef6c00" stroke-width="1.8" fill="none">
    <path d="M 275 396 L 290 396 L 290 418" marker-end="url(#arr)"/>
    <path d="M 575 396 L 590 396 L 590 418" marker-end="url(#arr)"/>
  </g>

  <!-- programme principal : jamais suspendu -->
  <rect x="60" y="478" width="790" height="34" rx="4" fill="#e8eaf6" stroke="#1a237e" stroke-width="1.5"/>
  <text x="455" y="500" font-size="13" font-weight="600" fill="#1a237e" text-anchor="middle">loop() : continue de s'exécuter (ou dort), sans être suspendu</text>
</svg>
