<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Bus I2C : un maître (la carte Raspberry Pi) et trois esclaves (une horloge temps réel d'adresse 0x68, un expandeur d'entrées-sorties d'adresse 0x20 et un convertisseur analogique-numérique d'adresse 0x33) reliés par deux fils, SDA pour les données et SCL pour l'horloge, chacun tiré au niveau haut par une résistance de tirage">

  <rect width="900" height="400" fill="#ffffff"/>

  <!-- rail d'alimentation -->
  <line x1="205" y1="48" x2="325" y2="48" stroke="#263238" stroke-width="2"/>
  <text x="195" y="52" font-size="13" font-weight="600" fill="#263238" text-anchor="end">3,3 V</text>

  <!-- résistances de tirage -->
  <g stroke="#263238" stroke-width="1.8" fill="none">
    <line x1="240" y1="48" x2="240" y2="70"/>
    <rect x="232" y="70" width="16" height="42" fill="#ffffff"/>
    <line x1="240" y1="112" x2="240" y2="160"/>
    <line x1="290" y1="48" x2="290" y2="70"/>
    <rect x="282" y="70" width="16" height="42" fill="#ffffff"/>
    <line x1="290" y1="112" x2="290" y2="210"/>
  </g>
  <text x="218" y="96" font-size="12" font-weight="600" fill="#263238" text-anchor="end">Rp</text>
  <text x="318" y="96" font-size="12" font-weight="600" fill="#263238">Rp</text>
  <text x="228" y="128" font-size="11" fill="#546e7a" text-anchor="end">tirage</text>

  <!-- fils SDA et SCL -->
  <line x1="150" y1="160" x2="860" y2="160" stroke="#1a237e" stroke-width="3"/>
  <line x1="150" y1="210" x2="860" y2="210" stroke="#2e7d32" stroke-width="3"/>
  <text x="860" y="150" font-size="14" font-weight="600" fill="#1a237e" text-anchor="end">SDA : les données</text>
  <text x="860" y="232" font-size="14" font-weight="600" fill="#2e7d32" text-anchor="end">SCL : l'horloge</text>

  <!-- maître -->
  <rect x="30" y="130" width="120" height="110" rx="8" fill="#f5f7fa" stroke="#1a237e" stroke-width="2"/>
  <text x="90" y="165" font-size="15" font-weight="600" fill="#1a237e" text-anchor="middle">Maître</text>
  <text x="90" y="187" font-size="12" fill="#263238" text-anchor="middle">Raspberry Pi</text>
  <text x="90" y="205" font-size="11" fill="#546e7a" text-anchor="middle">GPIO2 (SDA)</text>
  <text x="90" y="220" font-size="11" fill="#546e7a" text-anchor="middle">GPIO3 (SCL)</text>
  <circle cx="240" cy="160" r="3.5" fill="#263238"/>
  <circle cx="290" cy="210" r="3.5" fill="#263238"/>

  <!-- esclaves -->
  <g stroke="#263238" stroke-width="1.8" fill="none">
    <line x1="410" y1="160" x2="410" y2="270"/>
    <line x1="450" y1="210" x2="450" y2="270"/>
    <line x1="580" y1="160" x2="580" y2="270"/>
    <line x1="620" y1="210" x2="620" y2="270"/>
    <line x1="750" y1="160" x2="750" y2="270"/>
    <line x1="790" y1="210" x2="790" y2="270"/>
  </g>
  <g fill="#263238">
    <circle cx="410" cy="160" r="3.5"/><circle cx="450" cy="210" r="3.5"/>
    <circle cx="580" cy="160" r="3.5"/><circle cx="620" cy="210" r="3.5"/>
    <circle cx="750" cy="160" r="3.5"/><circle cx="790" cy="210" r="3.5"/>
  </g>

  <rect x="380" y="270" width="100" height="84" rx="8" fill="#ffffff" stroke="#c62828" stroke-width="2"/>
  <text x="430" y="296" font-size="14" font-weight="600" fill="#c62828" text-anchor="middle">Esclave</text>
  <text x="430" y="316" font-size="12" fill="#263238" text-anchor="middle">DS1339</text>
  <text x="430" y="332" font-size="11" fill="#546e7a" text-anchor="middle">horloge temps réel</text>
  <text x="430" y="347" font-size="12" font-weight="600" fill="#263238" text-anchor="middle">adresse 0x68</text>

  <rect x="550" y="270" width="100" height="84" rx="8" fill="#ffffff" stroke="#c62828" stroke-width="2"/>
  <text x="600" y="296" font-size="14" font-weight="600" fill="#c62828" text-anchor="middle">Esclave</text>
  <text x="600" y="316" font-size="12" fill="#263238" text-anchor="middle">MAX7311</text>
  <text x="600" y="332" font-size="11" fill="#546e7a" text-anchor="middle">expandeur d'E/S</text>
  <text x="600" y="347" font-size="12" font-weight="600" fill="#263238" text-anchor="middle">adresse 0x20</text>

  <rect x="720" y="270" width="100" height="84" rx="8" fill="#ffffff" stroke="#c62828" stroke-width="2"/>
  <text x="770" y="296" font-size="14" font-weight="600" fill="#c62828" text-anchor="middle">Esclave</text>
  <text x="770" y="316" font-size="12" fill="#263238" text-anchor="middle">MAX11615</text>
  <text x="770" y="332" font-size="11" fill="#546e7a" text-anchor="middle">convertisseur A/N</text>
  <text x="770" y="347" font-size="12" font-weight="600" fill="#263238" text-anchor="middle">adresse 0x33</text>

  <text x="450" y="385" font-size="12" fill="#546e7a" text-anchor="middle">Deux fils pour tout le monde : chaque esclave a sa propre adresse, et seul le maître prend l'initiative des échanges.</text>
</svg>
