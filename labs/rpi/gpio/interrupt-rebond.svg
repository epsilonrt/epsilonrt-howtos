<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Chronogramme des rebonds d'un bouton : la broche subit sept fronts à l'appui et cinq au relâchement ; sans filtrage la routine d'interruption est appelée douze fois ; avec un filtrage de durée D, elle n'est appelée qu'une fois pour l'appui et une fois pour le relâchement, avec un retard D">

  <defs>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#37474f"/>
    </marker>
  </defs>

  <rect width="900" height="440" fill="#ffffff"/>

  <!-- ===== Ligne 1 : le signal sur la broche ===== -->
  <text x="20" y="84" font-size="14" font-weight="600" fill="#1a237e">Broche</text>
  <text x="20" y="101" font-size="11" fill="#546e7a">bouton entre la</text>
  <text x="20" y="114" font-size="11" fill="#546e7a">broche et la masse</text>

  <g stroke="#cfd8dc" stroke-width="1">
    <line x1="140" y1="70" x2="870" y2="70"/>
    <line x1="140" y1="120" x2="870" y2="120"/>
  </g>
  <text x="134" y="74" font-size="12" font-weight="600" fill="#263238" text-anchor="end">3,3 V</text>
  <text x="134" y="124" font-size="12" font-weight="600" fill="#263238" text-anchor="end">0 V</text>

  <!-- guides verticaux vers la ligne 2 -->
  <g stroke="#b0bec5" stroke-width="1" stroke-dasharray="3 3">
    <line x1="190" y1="120" x2="190" y2="215"/>
    <line x1="215" y1="120" x2="215" y2="215"/>
    <line x1="225" y1="120" x2="225" y2="215"/>
    <line x1="245" y1="120" x2="245" y2="215"/>
    <line x1="255" y1="120" x2="255" y2="215"/>
    <line x1="270" y1="120" x2="270" y2="215"/>
    <line x1="278" y1="120" x2="278" y2="215"/>
    <line x1="600" y1="120" x2="600" y2="215"/>
    <line x1="610" y1="120" x2="610" y2="215"/>
    <line x1="630" y1="120" x2="630" y2="215"/>
    <line x1="636" y1="120" x2="636" y2="215"/>
    <line x1="650" y1="120" x2="650" y2="215"/>
  </g>

  <path d="M 150 70 L 190 70 L 190 120 L 215 120 L 215 70 L 225 70 L 225 120 L 245 120 L 245 70 L 255 70 L 255 120 L 270 120 L 270 70 L 278 70 L 278 120 L 600 120 L 600 70 L 610 70 L 610 120 L 630 120 L 630 70 L 636 70 L 636 120 L 650 120 L 650 70 L 860 70"
        fill="none" stroke="#1a237e" stroke-width="3" stroke-linejoin="miter"/>

  <text x="234" y="50" font-size="13" font-weight="600" fill="#263238" text-anchor="middle">appui : les rebonds</text>
  <text x="625" y="50" font-size="13" font-weight="600" fill="#263238" text-anchor="middle">relâchement : les rebonds</text>
  <text x="330" y="112" font-size="12" fill="#546e7a">bouton maintenu appuyé</text>
  <text x="792" y="144" font-size="12" fill="#546e7a" text-anchor="end">temps</text>
  <line x1="800" y1="140" x2="860" y2="140" stroke="#546e7a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ===== Ligne 2 : sans filtrage ===== -->
  <text x="20" y="200" font-size="14" font-weight="600" fill="#c62828">Sans filtrage</text>
  <text x="20" y="217" font-size="11" fill="#546e7a">une flèche = un appel</text>
  <text x="20" y="230" font-size="11" fill="#546e7a">de la routine</text>

  <line x1="140" y1="235" x2="870" y2="235" stroke="#cfd8dc" stroke-width="1"/>
  <g stroke="#c62828" stroke-width="2" fill="none">
    <line x1="190" y1="235" x2="190" y2="196" marker-end="url(#arrRed)"/>
    <line x1="215" y1="235" x2="215" y2="196" marker-end="url(#arrRed)"/>
    <line x1="225" y1="235" x2="225" y2="196" marker-end="url(#arrRed)"/>
    <line x1="245" y1="235" x2="245" y2="196" marker-end="url(#arrRed)"/>
    <line x1="255" y1="235" x2="255" y2="196" marker-end="url(#arrRed)"/>
    <line x1="270" y1="235" x2="270" y2="196" marker-end="url(#arrRed)"/>
    <line x1="278" y1="235" x2="278" y2="196" marker-end="url(#arrRed)"/>
    <line x1="600" y1="235" x2="600" y2="196" marker-end="url(#arrRed)"/>
    <line x1="610" y1="235" x2="610" y2="196" marker-end="url(#arrRed)"/>
    <line x1="630" y1="235" x2="630" y2="196" marker-end="url(#arrRed)"/>
    <line x1="636" y1="235" x2="636" y2="196" marker-end="url(#arrRed)"/>
    <line x1="650" y1="235" x2="650" y2="196" marker-end="url(#arrRed)"/>
  </g>
  <text x="440" y="222" font-size="13" font-weight="600" fill="#c62828" text-anchor="middle">12 appels de la routine</text>
  <text x="440" y="238" font-size="11" fill="#546e7a" text-anchor="middle">pour 1 appui et 1 relâchement</text>

  <!-- ===== Ligne 3 : avec filtrage ===== -->
  <text x="20" y="316" font-size="14" font-weight="600" fill="#2e7d32">Avec filtrage</text>
  <text x="20" y="333" font-size="11" fill="#546e7a">de durée D</text>

  <line x1="140" y1="350" x2="870" y2="350" stroke="#cfd8dc" stroke-width="1"/>
  <rect x="190" y="296" width="198" height="44" rx="6" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1.2"/>
  <rect x="600" y="296" width="160" height="44" rx="6" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1.2"/>
  <text x="289" y="315" font-size="11" fill="#2e7d32" text-anchor="middle">le noyau attend que</text>
  <text x="289" y="329" font-size="11" fill="#2e7d32" text-anchor="middle">le signal reste stable</text>
  <text x="680" y="315" font-size="11" fill="#2e7d32" text-anchor="middle">le noyau attend que</text>
  <text x="680" y="329" font-size="11" fill="#2e7d32" text-anchor="middle">le signal reste stable</text>

  <g stroke="#2e7d32" stroke-width="2.5" fill="none">
    <line x1="388" y1="350" x2="388" y2="296" marker-end="url(#arrGreen)"/>
    <line x1="760" y1="350" x2="760" y2="296" marker-end="url(#arrGreen)"/>
  </g>
  <text x="388" y="284" font-size="13" font-weight="600" fill="#2e7d32" text-anchor="middle">1 appel</text>
  <text x="760" y="284" font-size="13" font-weight="600" fill="#2e7d32" text-anchor="middle">1 appel</text>

  <!-- durée D -->
  <line x1="280" y1="372" x2="386" y2="372" stroke="#37474f" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="278" y1="352" x2="278" y2="380" stroke="#90a4ae" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="388" y1="352" x2="388" y2="380" stroke="#90a4ae" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="333" y="390" font-size="13" font-weight="600" fill="#263238" text-anchor="middle">D</text>
  <line x1="652" y1="372" x2="758" y2="372" stroke="#37474f" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="650" y1="352" x2="650" y2="380" stroke="#90a4ae" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="760" y1="352" x2="760" y2="380" stroke="#90a4ae" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="705" y="390" font-size="13" font-weight="600" fill="#263238" text-anchor="middle">D</text>

  <text x="450" y="420" font-size="12" fill="#546e7a" text-anchor="middle">D compte à partir du dernier front : la routine est appelée une seule fois, avec un retard D. Échelle des temps non respectée.</text>
</svg>
